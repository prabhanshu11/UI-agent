[project]
name = "ui-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.76.0",
    "fastapi>=0.128.0",
    "jinja2>=3.1.6",
    "mss>=10.1.0",
    "numpy>=2.4.1",
    "pillow>=12.1.0",
    "scipy>=1.14.0",
    "pynput>=1.8.1",
    "python-multipart>=0.0.21",
    "pyyaml>=6.0.3",
    "uvicorn>=0.40.0",
    "pyserial>=3.5",
    "opencv-python>=4.13.0.92",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "claude-agent-sdk>=0.1.37",
    "torch>=2.0.0",
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
