[project]
name = "ui-agent"
version = "0.2.0"
description = "UI automation agent with browser control for shopping and web tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mss>=10.1.0",
    "pynput>=1.8.1",
    "playwright>=1.49.0",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
