<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Agent Test Bench</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        h1 {
            color: #4caf50;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 800px;
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .panel {
            padding: 1rem;
            border: 1px solid #444;
            border-radius: 4px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #555;
            padding-bottom: 0.5rem;
        }

        .control-group {
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #btn-start { background-color: #2196f3; color: white; }
        #btn-stop { background-color: #f44336; color: white; }
        #btn-reset { background-color: #ff9800; color: black; }

        input[type="text"] {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #333;
            color: white;
        }

        .status-box {
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 1rem;
            background-color: #444;
        }

        .status-idle { background-color: #757575; }
        .status-running { background-color: #4caf50; color: white; }
        .status-stopped { background-color: #f44336; color: white; }

        #log-area {
            grid-column: 1 / -1;
            height: 150px;
            background-color: #111;
            border: 1px solid #333;
            padding: 0.5rem;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>UI Agent Test Bench</h1>

    <div class="container">
        
        <!-- Controls Panel -->
        <div class="panel">
            <h2>Controls</h2>
            <div class="control-group">
                <button id="btn-start" onclick="setStatus('RUNNING')">Start Process</button>
                <button id="btn-stop" onclick="setStatus('STOPPED')">Stop Process</button>
                <button id="btn-reset" onclick="resetBench()">Reset</button>
            </div>
            <div class="control-group">
                <label for="input-data">Data Input:</label>
                <input type="text" id="input-data" placeholder="Type here...">
                <button onclick="logInput()">Submit Input</button>
            </div>
        </div>

        <!-- Visual Feedback Panel -->
        <div class="panel">
            <h2>Status & Feedback</h2>
            <div id="status-indicator" class="status-box status-idle">IDLE</div>
            
            <div style="margin-top: 2rem;">
                <label>Counter:</label>
                <span id="counter-value" style="font-size: 2rem; font-weight: bold; margin-left: 1rem;">0</span>
            </div>
        </div>

        <!-- Log Area -->
        <div id="log-area">
            <div>[System] Test Bench Initialized.</div>
        </div>

    </div>

    <script>
        const statusBox = document.getElementById('status-indicator');
        const logArea = document.getElementById('log-area');
        const counterSpan = document.getElementById('counter-value');
        let counter = 0;
        let intervalId = null;

        function addLog(msg) {
            const line = document.createElement('div');
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logArea.prepend(line);
        }

        function setStatus(state) {
            statusBox.className = 'status-box'; // reset classes
            
            if (state === 'RUNNING') {
                statusBox.classList.add('status-running');
                statusBox.textContent = 'RUNNING';
                addLog('Process Started');
                if (!intervalId) {
                    intervalId = setInterval(() => {
                        counter++;
                        counterSpan.textContent = counter;
                    }, 1000);
                }
            } else if (state === 'STOPPED') {
                statusBox.classList.add('status-stopped');
                statusBox.textContent = 'STOPPED';
                addLog('Process Stopped');
                clearInterval(intervalId);
                intervalId = null;
            } else {
                statusBox.classList.add('status-idle');
                statusBox.textContent = 'IDLE';
            }
        }

        function resetBench() {
            setStatus('IDLE');
            counter = 0;
            counterSpan.textContent = counter;
            document.getElementById('input-data').value = '';
            addLog('System Reset');
        }

        function logInput() {
            const val = document.getElementById('input-data').value;
            if (val) {
                addLog(`User Input: ${val}`);
                document.getElementById('input-data').value = '';
            }
        }
    </script>
</body>
</html>
